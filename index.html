<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NEURO-FIGHTER: Avance</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<button id="sound-toggle" type="button" aria-pressed="false" style="position:fixed;top:12px;right:12px;z-index:50;font:inherit;color:inherit;background:#142431;border:1px solid #4ee6f2;border-radius:4px;padding:4px 8px;cursor:pointer">SONIDO: ON</button>

<div id="arcade-frame">
  <canvas id="stage" width="384" height="216"></canvas>
  <div class="scanlines"></div>

  <div id="touch-controls" aria-hidden="true">
    <div id="touch-move">
      <div class="tbtn trow" data-key="w">&#9650;</div>
      <div class="trowmid">
        <div class="tbtn" data-key="a">&#9664;</div>
        <div class="tbtn" data-key="s">&#9660;</div>
        <div class="tbtn" data-key="d">&#9654;</div>
      </div>
    </div>
    <div id="touch-actions">
      <div class="tbtn tact" data-key="u">GOLPE</div>
      <div class="tbtn tact" data-key="i">BOLA</div>
      <div class="tbtn tact" data-key="o">GUARD</div>
      <div class="tbtn tact" data-key=" ">SALTO</div>
    </div>
  </div>
</div>

<div id="toolbar">
  <span><b class="key">A</b> <b class="key">D</b> Mover</span>
  <span><b class="key">W</b> <b class="key">S</b> Profundidad</span>
  <span><b class="key">ESPACIO</b> Salto</span>
  <span><b class="key">U</b> Golpe (combo x3)</span>
  <span><b class="key">I</b> Neuro-Ball</span>
  <span><b class="key">O</b> Guardia</span>
  <span><b class="key">M</b> Sonido</span>
  <span><b class="key">H</b> Cajas de colisión</span>
  <span><b class="key">MOTO-V</b> (tramo 2, pista de neón): ESPACIO salta barreras y estelas · <b class="key">U</b> turbo · tu estela corta a los rivales</span>
</div>

<script src="cine-data1.js?v=20261028-noir"></script>
<script src="cine-data2.js?v=20261028-noir"></script>
<script src="cine-data3.js?v=20261028-noir"></script>
<script src="cine-data4.js?v=20261028-noir"></script>
<script src="cine-data5.js?v=20261028-noir"></script>
<script src="cine-data6.js?v=20261028-noir"></script>
<script src="game-a.js?v=20261028-noir2"></script>
<script src="game-b.js?v=20261028-noir2"></script>
</body>
</html>
